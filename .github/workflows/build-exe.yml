# Builds EQLAssistant.exe on a Windows machine on GitHub.
#
#  - Every push: the .exe is attached to the run (Actions tab -> the run -> Artifacts).
#  - Push to main with a new __version__ in eqlc/__init__.py (e.g. "1.0.1"): a tag
#    v1.0.1 and a GitHub Release are created with EQLAssistant.exe and its SHA-256
#    checksum. Pushes that keep the same version just build.
#  - Or push a tag like v1.0.1 yourself: same Release, with that version stamped in.
#  - Or run it by hand: Actions -> Build EXE -> Run workflow.
name: Build EXE
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover tests
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview pillow
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content eqlc/__init__.py) -replace '__version__ = ".*?"', "__version__ = `"$v`"" | Set-Content eqlc/__init__.py
          Get-Content eqlc/__init__.py
      - name: Decide release
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
            $m = Select-String -Path eqlc/__init__.py -Pattern '__version__ = "(.*?)"'
            $tag = "v" + $m.Matches[0].Groups[1].Value
          } else {
            "release=false" >> $env:GITHUB_OUTPUT; exit 0
          }
          gh release view $tag --repo "${{ github.repository }}" 2>$null | Out-Null
          $new = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$new" >> $env:GITHUB_OUTPUT
          "Release $tag : $new"
      - name: Build EQLAssistant.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EQLAssistant
          --icon assets/icon.ico --add-data "web;web" --add-data "assets/icon.ico;assets"
          --hidden-import overlay_window --hidden-import PIL.ImageGrab --hidden-import PIL.ImageDraw
          --hidden-import PIL.ImageFont --collect-submodules eqlc main.py
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/EQLAssistant.exe -Algorithm SHA256).Hash.ToLower()
          "$h  EQLAssistant.exe" | Set-Content -Encoding ascii dist/EQLAssistant.exe.sha256
          Get-Content dist/EQLAssistant.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EQLAssistant
          path: |
            dist/EQLAssistant.exe
            dist/EQLAssistant.exe.sha256
      - name: Release notes
        if: steps.rel.outputs.release == 'true'
        shell: pwsh
        run: |
          # "What's new" = the commit message of this release (the app shows it in its update banner)
          $msg = (git log -1 --format=%B) | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = @("## What's new", "") + $msg + @("", "## Download",
            "Download **EQLAssistant.exe** below and double-click it. No install needed.", "",
            "- Windows may show ""Windows protected your PC"" because the file isn't code-signed. Click **More info → Run anyway**.",
            "- In EverQuest Legends, type ``/log on``, then pick your ``Logs`` folder in the app's **Settings**.",
            "- Run the game in **borderless windowed** mode so the overlays stay on top.",
            "- Updating? Quit the old EQL Assistant and run the new EQLAssistant.exe. Your settings and data are kept.")
          $notes -join "`n" | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md
      - name: Publish release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EQL Assistant ${{ steps.rel.outputs.tag }}
          files: |
            dist/EQLAssistant.exe
            dist/EQLAssistant.exe.sha256
          generate_release_notes: true
          body_path: release-notes.md
